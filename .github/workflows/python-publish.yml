# This workflow will upload a Python Package using Twine when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Install uv
      uses: astral-sh/setup-uv@v5
    - name: Check that the release tag matches the package version
      env:
        TAG: ${{ github.event.release.tag_name }}
      run: |
        version="$(uv version --short --no-sync)"
        uv run --no-project --with packaging python - "$TAG" "$version" <<'PY'
        import sys
        from packaging.version import Version

        tag, version = sys.argv[1:]
        if Version(tag) != Version(version):
            sys.exit(
                f"Release tag {tag!r} does not match version {version!r} "
                "in pyproject.toml. Update the version with `uv version` "
                "before creating the release."
            )
        PY
    - name: Build package
      run: uv build
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@v1.13.0
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}

  bump-version:
    # After publishing a release, open a pull request that bumps the
    # version on the default branch to the next minor development
    # version (e.g., 0.6.0 -> 0.7.0.dev0).
    needs: deploy
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.repository.default_branch }}
    - name: Install uv
      uses: astral-sh/setup-uv@v5
    - name: Bump to the next minor development version
      id: bump
      run: |
        uv version --bump minor --bump dev=0 --no-sync
        echo "version=$(uv version --short --no-sync)" >> "$GITHUB_OUTPUT"
    - name: Open pull request
      uses: peter-evans/create-pull-request@v8
      with:
        branch: bump-version-${{ steps.bump.outputs.version }}
        commit-message: Bump version to ${{ steps.bump.outputs.version }}
        title: Bump version to ${{ steps.bump.outputs.version }}
        body: |
          Bump the version in `pyproject.toml` to ${{ steps.bump.outputs.version }} following the release of ${{ github.event.release.tag_name }}.

          This pull request was opened automatically by the `bump-version` job in `.github/workflows/python-publish.yml`.
        add-paths: pyproject.toml
